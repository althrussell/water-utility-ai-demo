# Seqwater AI demo - 1. Data platform
# Synthetic Seqwater operating data, governed KPI layer (metric views) and the daily
# proactive insights engine. Deploy with the repo CLI (./seqwater-demo install) or directly:
#   databricks bundle deploy -p <profile> --var catalog=<catalog>
#   databricks bundle run seqwater_daily_refresh -p <profile>
bundle:
  name: seqwater-ai-demo-data

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the demo schema (must already exist).
    default: main
  schema:
    description: Schema created for the demo tables.
    default: seqwater_demo
  llm_endpoint:
    description: Model serving endpoint ai_query uses to write insight narratives and the morning briefing.
    default: databricks-claude-sonnet-4-6
  refresh_schedule_status:
    description: UNPAUSED keeps the demo current with a daily 5:15am (Brisbane) refresh; PAUSED disables it.
    default: UNPAUSED

targets:
  demo:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}
